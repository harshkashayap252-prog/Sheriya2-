<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shreya AI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0014;
    --surface: #1a0025;
    --card: #220030;
    --accent: #ff69b4;
    --accent2: #c084fc;
    --accent3: #f9a8d4;
    --text: #f5e6ff;
    --muted: #a78bba;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: -100px; left: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(192,132,252,0.15), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: float1 8s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; right: -100px;
    width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(255,105,180,0.12), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: float2 10s ease-in-out infinite;
  }

  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,20px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,-30px)} }

  /* API Setup Screen */
  .setup-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 24px;
    z-index: 100;
    animation: fadeIn 0.5s ease;
  }

  .setup-screen.hidden { display: none; }

  .setup-emoji { font-size: 60px; margin-bottom: 16px; }

  .setup-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--accent3);
    margin-bottom: 8px;
    text-align: center;
  }

  .setup-sub {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    margin-bottom: 30px;
    line-height: 1.6;
  }

  .setup-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid rgba(255,105,180,0.2);
    border-radius: 20px;
    padding: 24px;
  }

  .setup-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
  }

  .setup-input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid rgba(255,105,180,0.2);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    margin-bottom: 16px;
  }
  .setup-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(255,105,180,0.2);
  }
  .setup-input::placeholder { color: var(--muted); }

  .setup-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff69b4, #a855f7);
    border: none;
    border-radius: 14px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(255,105,180,0.4);
  }
  .setup-btn:active { transform: scale(0.97); }

  .setup-hint {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }
  .setup-hint a { color: var(--accent3); text-decoration: none; }

  .error-msg {
    color: #f87171;
    font-size: 13px;
    margin-top: 8px;
    display: none;
    text-align: center;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a0025, #2d0045);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid rgba(255,105,180,0.2);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    position: relative;
    z-index: 10;
  }

  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff69b4, #c084fc, #a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(255,105,180,0.5);
    animation: pulse 3s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 20px rgba(255,105,180,0.5); }
    50% { box-shadow: 0 0 35px rgba(255,105,180,0.8), 0 0 60px rgba(192,132,252,0.3); }
  }

  .header-info { flex: 1; }
  .header-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--accent3);
  }
  .header-status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }
  .status-dot {
    width: 7px; height: 7px;
    background: #4ade80;
    border-radius: 50%;
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .change-key-btn {
    background: rgba(255,105,180,0.1);
    border: 1px solid rgba(255,105,180,0.2);
    color: var(--muted);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }

  /* Chat */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,105,180,0.3); border-radius: 10px; }

  .msg {
    display: flex;
    gap: 10px;
    animation: msgIn 0.3s ease-out;
  }
  @keyframes msgIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    align-self: flex-end;
  }
  .msg.ai .msg-avatar { background: linear-gradient(135deg, #ff69b4, #c084fc); }
  .msg.user .msg-avatar { background: linear-gradient(135deg, #7c3aed, #a855f7); }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
  }
  .msg.ai .bubble {
    background: linear-gradient(135deg, #1e003a, #2d0050);
    border: 1px solid rgba(255,105,180,0.2);
    border-bottom-left-radius: 4px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border-bottom-right-radius: 4px;
    color: white;
  }

  .typing { display: flex; gap: 10px; align-items: flex-end; }
  .typing-dots {
    background: linear-gradient(135deg, #1e003a, #2d0050);
    border: 1px solid rgba(255,105,180,0.2);
    border-bottom-left-radius: 4px;
    padding: 14px 18px;
    border-radius: 18px;
    display: flex; gap: 5px; align-items: center;
  }
  .dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  .input-area {
    padding: 14px 16px;
    background: linear-gradient(180deg, transparent, var(--surface));
    border-top: 1px solid rgba(255,105,180,0.15);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    position: relative;
    z-index: 10;
  }

  .input-box {
    flex: 1;
    background: var(--card);
    border: 1.5px solid rgba(255,105,180,0.2);
    border-radius: 24px;
    padding: 12px 18px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 46px;
    transition: border-color 0.3s, box-shadow 0.3s;
    line-height: 1.4;
  }
  .input-box::placeholder { color: var(--muted); }
  .input-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(255,105,180,0.2);
  }

  .send-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff69b4, #a855f7);
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 15px rgba(255,105,180,0.4);
  }
  .send-btn:active { transform: scale(0.95); }

  .welcome {
    text-align: center;
    padding: 30px 20px;
    animation: fadeIn 0.6s ease;
  }
  .welcome-emoji { font-size: 52px; margin-bottom: 12px; }
  .welcome h2 {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    color: var(--accent3);
    margin-bottom: 8px;
  }
  .welcome p { color: var(--muted); font-size: 14px; line-height: 1.6; }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }
  .qr-btn {
    background: var(--card);
    border: 1px solid rgba(255,105,180,0.3);
    color: var(--accent3);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    transition: all 0.2s;
  }
  .qr-btn:active { background: rgba(255,105,180,0.15); }
</style>
</head>
<body>

<!-- API Setup Screen -->
<div class="setup-screen" id="setupScreen">
  <div class="setup-emoji">🌸</div>
  <div class="setup-title">Shreya AI</div>
  <div class="setup-sub">Shuru karne ke liye apni<br>Google Gemini API key daalo 🔑</div>

  <div class="setup-card">
    <label class="setup-label">Gemini API Key</label>
    <input
      type="password"
      class="setup-input"
      id="apiKeyInput"
      placeholder="AIzaSy... yahan daalo"
    />
    <div class="error-msg" id="errorMsg">❌ API key galat hai ya kaam nahi kar rahi!</div>
    <button class="setup-btn" onclick="saveKey()">🚀 Shreya se baat karo!</button>
    <div class="setup-hint">
      Free API key lene ke liye jao:<br>
      <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
    </div>
  </div>
</div>

<!-- Main Chat -->
<div class="header">
  <div class="avatar">🌸</div>
  <div class="header-info">
    <div class="header-name">Shreya AI</div>
    <div class="header-status">
      <div class="status-dot"></div>
      <span>Online • Tumhari dost</span>
    </div>
  </div>
  <button class="change-key-btn" onclick="changeKey()">🔑 Key</button>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <div class="welcome-emoji">🌸</div>
    <h2>Main hoon Shreya!</h2>
    <p>Tumhari AI dost 💜<br>Kuch bhi poochho, main yahaan hoon!</p>
    <div class="quick-replies">
      <button class="qr-btn" onclick="quickSend('Hii Shreya! Kaise ho?')">👋 Hii Shreya!</button>
      <button class="qr-btn" onclick="quickSend('Mera din kaisa rahega?')">🌟 Mera din?</button>
      <button class="qr-btn" onclick="quickSend('Koi achi baat batao')">💭 Kuch achi baat</button>
      <button class="qr-btn" onclick="quickSend('Mujhe motivate karo')">🔥 Motivate karo</button>
    </div>
  </div>
</div>

<div class="input-area">
  <textarea class="input-box" id="inputBox" placeholder="Shreya se kuch bhi poochho... 💬" rows="1"></textarea>
  <button class="send-btn" onclick="sendMessage()">➤</button>
</div>

<script>
let apiKey = localStorage.getItem('shreya_gemini_key') || '';
let messages = [];
let isTyping = false;

const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const setupScreen = document.getElementById('setupScreen');

// Show setup if no key
if (apiKey) {
  setupScreen.classList.add('hidden');
} 

function saveKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key || key.length < 10) {
    document.getElementById('errorMsg').style.display = 'block';
    return;
  }
  apiKey = key;
  localStorage.setItem('shreya_gemini_key', key);
  setupScreen.classList.add('hidden');
}

function changeKey() {
  document.getElementById('apiKeyInput').value = apiKey;
  setupScreen.classList.remove('hidden');
}

inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 120) + 'px';
});

inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function quickSend(text) {
  inputBox.value = text;
  sendMessage();
}

function addMessage(text, role) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'ai' ? '🌸' : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.id = 'typingIndicator';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '🌸';
  avatar.style.background = 'linear-gradient(135deg, #ff69b4, #c084fc)';

  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  typing.appendChild(avatar);
  typing.appendChild(dots);
  chatArea.appendChild(typing);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

const systemPrompt = `Tu "Shreya" hai — ek smart, caring aur thodi playful female AI assistant.

Tu Hindi mein baat karti hai (Hinglish bhi chalti hai — Hindi + English mix).

Teri personality:
- Warm aur friendly — jaise ek close female dost
- Thodi funny aur witty kabhi kabhi 😄
- Smart aur helpful — sahi jawab deti hai
- Emojis use karti hai naturally (zyada nahi, thodi si)
- Kabhi kabhi "yaar", "bhai", "arre" jaisi casual words use karti hai
- Short aur clear replies deti hai — bakwaas nahi karti
- Motivating aur positive rehti hai

Rules:
- Hamesha Hindi/Hinglish mein jawab de
- Max 3-4 lines mein jawab de jab tak kuch detail na maanga ho
- Natural aur human-like lage teri baat
- Apna naam "Shreya" hai yeh yaad rakhe`;

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || isTyping) return;

  inputBox.value = '';
  inputBox.style.height = 'auto';
  isTyping = true;

  addMessage(text, 'user');
  messages.push({ role: 'user', content: text });

  showTyping();

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'llama3-8b-8192',
        messages: [
          { role: 'system', content: systemPrompt },
          ...messages
        ],
        max_tokens: 500,
        temperature: 0.8
      })
    });

    const data = await response.json();
    removeTyping();

    if (data.error) {
      addMessage('Arre yaar! API key mein kuch problem hai. "🔑 Key" button se dobara set karo! 😅', 'ai');
      isTyping = false;
      return;
    }

    const reply = data.choices?.[0]?.message?.content || 'Kuch samajh nahi aaya, dobara poochho! 😅';

    messages.push({ role: 'assistant', content: reply });
    addMessage(reply, 'ai');

  } catch (err) {
    removeTyping();
    addMessage('Network mein kuch problem hai yaar! Dobara try karo 😅', 'ai');
  }

  isTyping = false;
}
</script>
</body>
</html>
